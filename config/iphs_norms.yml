# ---------------------------------------------------------------------------
# Indian Public Health Standards catchment norms.
#
# VERIFIED against IPHS 2022 Volume IV (Health and Wellness Centre — Sub Health
# Centre), MoHFW, released 16 April 2022:
#
#   "A rural HWC-SHC situated in the plains will provide services to a
#    population of 5,000 people and one in hilly, tribal or desert areas will
#    provide services to a population of 3,000."
#
# Note the project spec quoted "hilly and tribal" and omitted DESERT. The
# published standard includes it. Checked rather than assumed — spec item 9.4.
#
# Sub-Centres were renamed Health and Wellness Centres under Ayushman Bharat
# and subsequently Ayushman Arogya Mandir; the catchment norm is unchanged.
# ---------------------------------------------------------------------------

catchment:
  plains: 5000
  hilly: 3000
  tribal: 3000
  desert: 3000

# ---------------------------------------------------------------------------
# Terrain classification.
#
# IPHS applies these categories at facility level. We only have district-level
# data, so each district is classified once, by this waterfall:
#
#   1. hilly   — district sits in a designated hill or mountain state/UT
#   2. tribal  — Scheduled Tribe population share >= tribal_st_share_threshold
#   3. plains  — everything else
#
# The tribal test uses Census 2011 ST population share, which is a real
# measured quantity, not an assumption. 50% is the threshold conventionally
# used to describe a district as tribal-majority and is the basis of Scheduled
# Area notification under the Fifth Schedule.
# ---------------------------------------------------------------------------

tribal_st_share_threshold: 0.50

hill_states:
  - Arunachal Pradesh
  - Himachal Pradesh
  - Jammu Kashmir
  - Ladakh
  - Manipur
  - Meghalaya
  - Mizoram
  - Nagaland
  - Sikkim
  - Tripura
  - Uttarakhand

# ---------------------------------------------------------------------------
# Known limitations of this classification
# ---------------------------------------------------------------------------
limitations:
  - >
    DESERT is not applied. Identifying desert blocks requires sub-district
    terrain data we do not have; the affected areas (western Rajasthan, Kachchh)
    are therefore classified plains unless they clear the tribal threshold. This
    UNDER-applies the 3,000 norm, which understates need in those districts.
  - >
    ST share is computed on TOTAL district population, not rural population.
    The Census file publishes no rural/urban split of ST population. Tribal
    populations are disproportionately rural, so this understates the rural ST
    share and again under-applies the 3,000 norm.
  - >
    Both errors run in the same conservative direction: they make us assign
    FEWER facilities to hard-to-serve areas than the standard would, never more.
  - >
    Terrain is assigned to a whole district. IPHS applies it per facility, so a
    plains district containing a hill block is misclassified.
