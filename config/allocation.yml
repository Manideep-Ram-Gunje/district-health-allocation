# ---------------------------------------------------------------------------
# Allocation problem definition.
#
# These are the numbers a State Health Society would hand you, and they are the
# reason optimisation is not the same thing as sorting. Change them here and
# the whole allocation moves — the Streamlit app exposes them as controls.
# ---------------------------------------------------------------------------

budget: 25                # Sub-Centres sanctioned

constraints:

  max_per_state: 4
  # Rationale: a national programme that put 11 of 25 facilities in one state
  # would not survive a Finance Commission review, regardless of what the need
  # data said. This is the binding constraint in practice — see the report.

  min_per_region: 1
  # Rationale: political feasibility. Every Zonal Council must see something.
  # Six regions, so this consumes at minimum 6 of the 25 facilities.

# ---------------------------------------------------------------------------
# Objective — a POLICY choice, and a consequential one.
#
# coverage_gain_population
#     need x min(catchment_norm, rural_population)
#     "Maximise raw population brought within catchment."
#     Literal reading of the spec. But the cap binds for only 2 of 696
#     districts, so in practice this reduces to need x 5000 in plains and
#     need x 3000 in hilly or tribal terrain — a 67% handicap for hard terrain.
#     Measured effect: the optimal 25 contains ZERO hilly or tribal districts,
#     although 23% of candidates are non-plains.
#
# coverage_gain_neutral   <-- default
#     need x min(1, rural_population / catchment_norm)
#     "One facility counts as one facility, wherever it stands."
#     Reads the IPHS norm the way the standard intends it: 3,000 is the hill
#     norm BECAUSE reaching 3,000 people in hills takes what reaching 5,000
#     takes in plains. Serving them is equivalent effort and equivalent value.
#     Measured effect: 9 of the 25 change, and hilly/tribal districts appear.
#
# Penalising hard terrain for being hard to serve inverts the purpose of the
# standard, so the neutral objective is the default. The alternative stays
# available and both are reported, because this is a judgement a State Health
# Society is entitled to make differently.
# ---------------------------------------------------------------------------

objective: coverage_gain_neutral

# ---------------------------------------------------------------------------
# Baselines to compare against.
#
# naive_top25      Sort by need index, take 25, ignore constraints entirely.
#                  Usually INFEASIBLE. Reported anyway, because it is what
#                  "just rank them" actually produces and the violations are
#                  the interesting part.
#
# greedy_feasible  Walk down the ranking BY THE OBJECTIVE, skip anything that
#                  would breach the state cap, then patch in empty regions.
#                  This is the honest comparator, and it is a strong one — for
#                  this problem structure it reaches the optimum. Reporting a
#                  premium against a weaker greedy would be a straw man.
#
# greedy_by_need   The same heuristic sorting on the NEED INDEX instead of the
#                  objective. This is the mistake an analyst actually makes:
#                  ranking by the headline metric rather than by the quantity
#                  being maximised. The gap between this and the optimum is a
#                  real and interesting number; calling it the "optimisation
#                  premium" would not be.
# ---------------------------------------------------------------------------

#
# unconstrained_bound  Top 25 by the OBJECTIVE, constraints dropped. The true
#                      ceiling — no feasible allocation can beat it. The gap
#                      between this and the optimum is the price of equity,
#                      which is the number worth quoting rather than a
#                      comparison against a list nobody could execute.

baselines: [naive_top25, unconstrained_bound, greedy_feasible, greedy_by_need]

solver:
  name: CBC
  time_limit_seconds: 60
  mip_gap: 0.0            # demand a proven optimum, not a good-enough answer
